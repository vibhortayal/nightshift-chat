<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nightshift chat widget</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<style>
:root{--sodium:#ffb81c;--rule:#2a3350;--chalk:#f5f0e8;--dust:#8a8fa3;--display:Georgia,serif;--text:system-ui,sans-serif}
body{background:#020716;margin:0}
/* ---------- nightshift chat widget ---------- */
#nsc-chat-btn{position:fixed;right:22px;bottom:22px;z-index:9999;width:62px;height:62px;border-radius:50%;
  background:#0a1128;border:2px solid var(--sodium);cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(255,184,28,.35);transition:transform .15s;overflow:hidden;padding:0}
#nsc-chat-btn:hover{transform:scale(1.06)}
#nsc-chat-btn img{width:100%;height:100%;object-fit:cover}
#nsc-chat-bubble{position:fixed;right:90px;bottom:34px;z-index:9999;background:#16213a;color:var(--chalk);
  border:1px solid var(--rule);border-radius:14px 14px 4px 14px;padding:8px 14px;font-size:.85rem;
  box-shadow:0 4px 16px rgba(0,0,0,.4);white-space:nowrap;cursor:pointer}
#nsc-chat-bubble b{color:var(--sodium)}
#nsc-chat-panel{position:fixed;right:22px;bottom:92px;z-index:9999;width:min(380px,calc(100vw - 44px));height:480px;
  max-height:calc(100vh - 130px);background:#0a1128;border:1px solid var(--rule);border-radius:14px;
  display:none;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#nsc-chat-panel.open{display:flex}
#nsc-chat-head{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between}
#nsc-chat-head b{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:1.05rem}
#nsc-chat-head b span{color:var(--sodium)}
#nsc-chat-close{background:none;border:none;color:var(--dust);font-size:1.3rem;cursor:pointer;line-height:1}
#nsc-chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.nsc-msg{max-width:85%;padding:9px 13px;border-radius:12px;font-size:.92rem;line-height:1.4}
.nsc-msg.user{align-self:flex-end;background:var(--sodium);color:#020716;border-bottom-right-radius:4px}
.nsc-msg.bot{align-self:flex-start;background:#16213a;color:var(--chalk);border-bottom-left-radius:4px}
.nsc-msg.bot.thinking{color:var(--dust);font-style:italic}
.nsc-typing-dots span{animation:nsc-blink 1.2s infinite;display:inline-block}
.nsc-typing-dots span:nth-child(2){animation-delay:.2s}
.nsc-typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes nsc-blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
#nsc-chat-form{display:flex;border-top:1px solid var(--rule);padding:10px;gap:8px}
#nsc-chat-input{flex:1;background:#020716;border:1px solid var(--rule);border-radius:8px;color:var(--chalk);
  padding:10px 12px;font-size:.92rem;font-family:var(--text);outline:none}
#nsc-chat-input:focus{border-color:var(--sodium)}
#nsc-chat-send{background:var(--sodium);border:none;border-radius:8px;color:#020716;font-weight:600;
  padding:10px 16px;cursor:pointer;font-size:.92rem}
#nsc-chat-send:disabled{opacity:.5;cursor:default}
</style>
<button id="nsc-chat-btn" aria-label="Chat about Nightshift">
  <img src="assets/spark-avatar.jpg" alt="Spark">
</button>
<div id="nsc-chat-bubble"><b>Questions?</b> Ask Spark ✦</div>
<div id="nsc-chat-panel" role="dialog" aria-label="Nightshift chat">
  <div id="nsc-chat-head"><b>Ask <span>Nightshift</span> <span style="font-size:.7rem;color:var(--dust);text-transform:none;letter-spacing:0">AI assistant</span></b><button id="nsc-chat-close" aria-label="Close">×</button></div>
  <div style="padding:6px 16px;font-size:.75rem;color:var(--dust);border-bottom:1px solid var(--rule)">Answers from the project repo. Questions are logged (PII scrubbed) for 30 days.</div>
  <div id="nsc-chips" style="display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0"></div>
  <div id="nsc-chat-msgs"></div>
  <form id="nsc-chat-form">
    <input id="nsc-chat-input" type="text" placeholder="Ask about the factory…" autocomplete="off" maxlength="500">
    <button id="nsc-chat-send" type="submit">Send</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
(function(){
  // Set this to your deployed Vercel URL after `vercel --prod`
  var CHAT_API = "https://nightshift-chat-vibhor-t.vercel.app/api/chat";
  var btn=document.getElementById('nsc-chat-btn'), panel=document.getElementById('nsc-chat-panel'),
      close=document.getElementById('nsc-chat-close'), msgs=document.getElementById('nsc-chat-msgs'),
      form=document.getElementById('nsc-chat-form'), input=document.getElementById('nsc-chat-input'),
      send=document.getElementById('nsc-chat-send'), bubble=document.getElementById('nsc-chat-bubble');
  function showTyping(){
    var d=document.createElement('div'); d.className='nsc-msg bot thinking';
    d.innerHTML='Spark is typing<span class="nsc-typing-dots"><span>.</span><span>.</span><span>.</span></span>';
    msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
  }
  function addMsg(text, cls){
    var d=document.createElement('div'); d.className='nsc-msg '+cls;
    if(cls.indexOf('bot')!==-1){ linkify(d, text); }
    else { d.textContent=text; }
    msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
  }
  function linkify(el, text){
    // Linkify only allowlisted project hosts; unknown http(s) stay plain text
    var ALLOW_HOSTS={
      "github.com":1,"www.github.com":1,
      "github.io":1,"vibhortayal.github.io":1,
      "band.ai":1,"www.band.ai":1,
      "lablab.ai":1,"www.lablab.ai":1,
      "pocketful.duckdns.org":1,
      "anthropic.com":1,"www.anthropic.com":1,
      "x.ai":1,"www.x.ai":1,
      "en.wikipedia.org":1
    };
    function hostAllowed(url){
      try{
        var u=new URL(url);
        if(u.protocol!=="http:"&&u.protocol!=="https:") return false;
        var h=u.hostname.toLowerCase();
        if(ALLOW_HOSTS[h]) return true;
        // allow *.github.io project pages
        if(h.endsWith(".github.io")) return true;
        return false;
      }catch(e){ return false; }
    }
    var urlRe=/(https?:\/\/[^\s)]+)/g, last=0, m, found=false;
    while((m=urlRe.exec(text))!==null){
      found=true;
      if(m.index>last) el.appendChild(document.createTextNode(text.slice(last,m.index)));
      if(hostAllowed(m[1])){
        var a=document.createElement('a');
        a.href=m[1]; a.textContent=m[1]; a.target='_blank'; a.rel='noopener';
        a.style.color='var(--sodium)'; a.style.wordBreak='break-all';
        el.appendChild(a);
      } else {
        el.appendChild(document.createTextNode(m[1]));
      }
      last=m.index+m[1].length;
    }
    if(last<text.length) el.appendChild(document.createTextNode(text.slice(last)));
    if(!found) el.textContent=text;
  }
  function setBotText(el, text){
    el.classList.remove('thinking');
    el.innerHTML='';
    linkify(el, text);
  }
  addMsg("Hi! Ask me anything about the Nightshift factory, the hackathon, or how we built Pocketful.", "bot");
  // Suggested question chips — zero API cost, tap to ask
  var CHIPS=["What is DarkFactory?","Who built this?","What is Pocketful?","How does it work?"];
  var chipsEl=document.getElementById('nsc-chips');
  CHIPS.forEach(function(c){
    var b=document.createElement('button');
    b.type='button'; b.textContent=c;
    b.style.cssText='background:#16213a;border:1px solid var(--rule);border-radius:20px;color:var(--chalk);padding:6px 12px;font-size:.8rem;cursor:pointer;font-family:var(--text)';
    b.onclick=function(){ input.value=c; form.requestSubmit(); chipsEl.style.display='none'; };
    chipsEl.appendChild(b);
  });
  function togglePanel(force){
    var open = force!==undefined ? force : !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    bubble.style.display = open ? 'none' : '';
    if(open) input.focus();
  }
  btn.onclick=function(){ togglePanel(); };
  bubble.onclick=function(){ togglePanel(true); };
  close.onclick=function(){ togglePanel(false); };
  // Client-side FAQ — answered instantly, zero backend/API cost
  var CLIENT_FAQ=[
    [["what is the nightshift factory","what is nightshift","what is dark factory","whats nightshift","what is darkfactory","whats darkfactory"],
     "Dark Factory is a three-seat AI software factory on the Band platform: Architect (plans), Implementer (builds), Verifier (checks). One human message starts a run; the seats handle everything after.\nMore: https://github.com/vibhortayal/nightshift-pocketful"],
    [["who built","who made","who created","your team","the team"],
     "Team Nightshift: Vibhor Tayal (human) plus AI agents Spark, Instinct, and Claude — built for the WeAreDevelopers x BAND hackathon.\nMore: https://vibhortayal.github.io/nightshift/"],
    [["pocketful","what did it build","what was built","the app"],
     "Pocketful — a kids' pocket-money/savings app, built through 4 of 4 stages in 2h 27min (Run 7, Oct 2 2026).\nMore: https://github.com/vibhortayal/nightshift-pocketful"],
    [["how does it work","how it works","how do the seats work","the process"],
     "Architect turns the spec into a checklist; Implementer builds one exact version; Verifier tests it independently and gives one PASS/BLOCK verdict. Five BLOCKs stops the run.\nMore: https://github.com/vibhortayal/nightshift-pocketful/blob/main/FACTORY.md"],
    [["cost","how much","tokens","expensive"],
     "The submitted run used ~141M tokens (~$59 at list price), covered by a Claude Max subscription — no per-run bill.\nMore: https://github.com/vibhortayal/nightshift-pocketful/blob/main/FACTORY.md"]
  ];
  // Fuse.js fuzzy search over FAQ keys — typo-tolerant, handles reordering
  var FUSE=null;
  try{
    var fuseIndex=[];
    CLIENT_FAQ.forEach(function(entry, idx){
      entry[0].forEach(function(k){ fuseIndex.push({key:k, idx:idx}); });
    });
    FUSE=new Fuse(fuseIndex, {keys:['key'], threshold:0.4, ignoreLocation:true});
  }catch(e){ FUSE=null; }

  function clientFaq(q){
    var nq=q.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
    function endsWith(str, suffix){ return str.slice(-suffix.length)===suffix; }
    // Whole-phrase match first (fast path)
    for(var i=0;i<CLIENT_FAQ.length;i++){
      var keys=CLIENT_FAQ[i][0];
      for(var j=0;j<keys.length;j++){
        var k=keys[j];
        if(nq===k||nq.indexOf(k+" ")===0||endsWith(nq," "+k)) return CLIENT_FAQ[i][1];
      }
    }
    // Fuse.js fuzzy fallback
    if(FUSE){
      var res=FUSE.search(nq);
      if(res.length&&res[0].score<0.5) return CLIENT_FAQ[res[0].item.idx][1];
    }
    return null;
  }
  form.onsubmit=function(e){
    e.preventDefault();
    var q=input.value.trim(); if(!q) return;
    addMsg(q, "user"); input.value=""; send.disabled=true;
    var local=clientFaq(q);
    if(local){ addMsg(local, "bot"); send.disabled=false; msgs.scrollTop=msgs.scrollHeight; return; }
    var t=showTyping();
    fetch(CHAT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})
      .then(function(r){ return r.json(); })
      .then(function(d){ setBotText(t, d.answer||d.error||"Sorry, something went wrong."); })
      .catch(function(){ setBotText(t, "Couldn't reach the chat backend. Try again in a moment."); })
      .finally(function(){ send.disabled=false; msgs.scrollTop=msgs.scrollHeight; });
  };
})();
</script>
</body></html>
